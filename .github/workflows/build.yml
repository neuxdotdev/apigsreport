name: Build
on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.3.12'
            - name: Cache Bun dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Setup Rust (for rmcm tool)
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
            - name: Cache Cargo dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      ~/.cargo/bin/rmcm
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-
            - name: Install rmcm (comment remover)
              run: |
                  if ! command -v rmcm &> /dev/null; then
                    cargo install --git https://github.com/neuxdotdev/comment-remover.git
                  fi
            - name: Add Cargo bin to PATH
              run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            - name: Type check
              run: bun run typecheck
            - name: Lint & format check
              run: |
                  bun run lint
                  bun run format:check
            - name: Run tests
              run: bun test
            - name: ️ Run production build
              run: bun run rebuild
            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: libts-csrfx-auth-build
                  path: |
                      build/
                      !build/**/*.map
                  retention-days: 7
                  if-no-files-found: error
            - name: Generate & upload docs
              run: bun run docs:generate
            - name: Build summary
              run: |
                  echo "Build completed successfully!"
                  echo "Build output: $(ls -lh build/)"
                  echo "Docs: $(ls -lh docs/ 2>/dev/null || echo 'not generated')"
